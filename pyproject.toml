[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mau-flow"
version = "0.1.0"
description = "A contract-first runtime for composing Minimal Agent Units."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mau-flow contributors" }]
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
openai = ["openai>=1.0,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mau_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
